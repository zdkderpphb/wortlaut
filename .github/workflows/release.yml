name: Release

# Builds the installers and attaches them to a draft GitHub release.
# Start it by pushing a tag (git tag v0.1.0 && git push --tags) or by hand
# under Actions → Release → Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Publishing a draft made by "Run workflow" creates its tag, which would
  # start this workflow again. Skip tags whose release is already published.
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=false
          if [ "${{ github.event_name }}" = "push" ]; then
            draft=$(gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null || echo none)
            [ "$draft" = "false" ] && published=true
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.published != 'true'
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            # Fixed names so the README can link straight to the latest download.
            assets: Wortlaut-Mac[ext]
          - name: Windows (x64)
            os: windows-latest
            args: --bundles nsis
            assets: Wortlaut-Windows[setup][ext]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-build-deps

      # Signing switches on by itself once these secrets exist (see docs/SIGNING.md).
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Wortlaut __VERSION__
          releaseDraft: true
          releaseBody: |
            ## Download

            - **Mac (Apple M1 oder neuer):** `Wortlaut-Mac.dmg`
            - **Windows 10/11:** `Wortlaut-Windows-setup.exe`

            Beim ersten Start lädt Wortlaut einmalig das Sprachmodell (ca. 3 GB). Danach funktioniert alles offline.
            Anleitung und Hilfe: siehe [README](https://github.com/${{ github.repository }}#readme).
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.assets }}

      # Users only need the DMG; the zipped .app is for auto-updates we don't use.
      - name: Keep only the DMG on the release page (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets" \
            --jq '.[] | select(.name | endswith(".tar.gz")) | .id' |
            while read -r asset; do gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset"; done

      # Smoke-test what users get: the bundled app must find its compute
      # backends, decode audio and write Word files.
      - name: Self-test the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Wortlaut.app"
          "$app/Contents/MacOS/wortlaut" --self-test "$RUNNER_TEMP/self-test.txt"

      - name: Install and test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/windows/test-installer.ps1 -Setup $setup.FullName

      # Microsoft Store package. The identity comes from Partner Center, stored
      # as repository variables (see docs/STORE.md); the Store signs on upload.
      - name: Build the Store package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_NAME }}
        run: ./scripts/windows/make-msix.ps1

      - name: Install and test the Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test-msix.ps1

      # Not on the release page: unsigned, it only installs through the Store.
      - name: Keep the Store package for upload to Partner Center
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: Wortlaut-Store-${{ steps.tauri.outputs.appVersion }}
          path: src-tauri/target/msix/Wortlaut-Store.msix
          if-no-files-found: error
