name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-build-deps

      - run: npm ci
      - run: npm run check
      - run: npm test
      # The Rust crate embeds the built frontend, so build it first.
      - run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  # Builds what Windows users get – the installer and the Store package –
  # and starts both, so packaging mistakes show up before a release.
  windows-package:
    name: Windows-Pakete
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/windows-build-deps

      - run: npm ci
      - run: npm run tauri build -- --bundles nsis

      - name: Install and test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/windows/test-installer.ps1 -Setup $setup.FullName

      - name: Build the Store package
        shell: pwsh
        run: ./scripts/windows/make-msix.ps1

      - name: Install and test the Store package
        shell: pwsh
        run: ./scripts/windows/test-msix.ps1
